includes:
- configs/mex-multi/equiformer_v2/base_ebm_mp20_three_property.yml
- configs/mex-multi/params/base_param_multi.yml

dataset:
  property_names: [eform, bandgap, gvrh]
  train_max_y_eform:   0.0753554868749999
  train_min_y_eform:   -4.146771990625
  train_max_y_bandgap: 8.8621
  train_min_y_bandgap: 0.0
  train_max_y_gvrh:    10.25500013
  train_min_y_gvrh:    -1.00877392

  train:
    format: lmdb
    src: data/mp20_2k/train
    weighted_sample: false
    transforms:
      normalizer:
        y_eform:
          mean:  -0.9081968666076421
          stdev: 0.9023098036805605
        y_bandgap:
          mean:  0.6777554444444445
          stdev: 1.4116654160023276
        y_gvrh:
          mean:  1.87382108355
          stdev: 0.5035529151692633

  val:
    src: data/mp20_2k/val
  test:
    src: data/mp20_2k/test

logger:
  name: wandb
  project: mex_inverse_design
  entity: dipannoydip
